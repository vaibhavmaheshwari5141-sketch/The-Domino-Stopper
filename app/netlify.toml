# Netlify: static React app from dist/ plus one function (netlify/functions/api.ts) serving /api/*.
# Set DATABRICKS_SERVER_HOSTNAME, DATABRICKS_HTTP_PATH and DATABRICKS_TOKEN in
# Site configuration -> Environment variables (scope: Functions). Never commit them.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # Settings that are not secret, so their everyday values ("databricks", "workspace", ...) do not fail the secret scan
  # when they are saved as secret variables. The token, HTTP path and host name are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "DATA_MODE,LOCAL_DATA_DIR,LOCAL_INPUT_DIR,CORS_ORIGINS,DATABRICKS_CATALOG,DATABRICKS_SCHEMA,CACHE_TTL_SECONDS,DATABRICKS_TIMEOUT_SECONDS,VITE_API_BASE_URL"

# Order matters: the API rewrite must come before the single-page-app fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
